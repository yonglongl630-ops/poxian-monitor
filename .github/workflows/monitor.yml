name: 破线监控自动生成

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions 使用 UTC 时间；北京时间 = UTC+8
    # 30 2,6 * * 1-5 = 北京时间 10:30 / 14:30（周一至周五）
    - cron: '30 2,6 * * 1-5'
    # 兜底：GitHub 定时调度偶尔会延迟或漏跑，15 分钟后补跑一次（重复触发由脚本去重，不会重复推送）
    - cron: '45 2,6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poxian-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 同步客户端分组（可选，配置 THS_COOKIE 后自动跟随客户端分组）
        env:
          THS_COOKIE: ${{ secrets.THS_COOKIE }}
        run: |
          if [ -n "$THS_COOKIE" ]; then
            python3 - <<'PY'
          import json, os
          cfg = json.load(open('config.json', encoding='utf-8')) if os.path.exists('config.json') else {}
          cfg['ths_cookie'] = os.environ['THS_COOKIE']
          json.dump(cfg, open('config.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
            if python3 ths_client_sync.py; then
              python3 - <<'PY'
          import json
          cfg = json.load(open('config.json', encoding='utf-8'))
          wf = json.load(open('config.workflow.json', encoding='utf-8'))
          if cfg.get('groups'):
              wf['groups'] = cfg['groups']
              wf['watchlist'] = cfg['watchlist']
              json.dump(wf, open('config.workflow.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
              print('已从同花顺客户端同步分组：' + '、'.join(cfg['groups'].keys()))
          PY
            else
              echo "同花顺分组同步失败（THS_COOKIE 可能已过期），继续使用仓库内配置的分组"
            fi
          fi

      - name: 拉取历史数据（用于走势图累计）
        run: |
          mkdir -p output
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/history.jsonl" -o output/history.jsonl || true

      - name: 注入推送密钥（可选，配置 SERVERCHAN_KEY 后生效）
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SERVERCHAN_CHANNEL: ${{ secrets.SERVERCHAN_CHANNEL }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = json.load(open('config.workflow.json', encoding='utf-8'))
          sc = os.environ.get('SERVERCHAN_KEY', '')
          ch = os.environ.get('SERVERCHAN_CHANNEL', '')
          fw = os.environ.get('FEISHU_WEBHOOK', '')
          fs = os.environ.get('FEISHU_SECRET', '')
          bk = os.environ.get('BARK_KEY', '')
          if sc or ch or fw or fs or bk:
              push = cfg.setdefault('push', {})
              if sc:
                  push['serverchan_key'] = sc
              if ch:
                  push['serverchan_channel'] = ch
              if fw:
                  push['feishu_webhook'] = fw
              if fs:
                  push['feishu_secret'] = fs
              if bk:
                  push['bark_key'] = bk
              json.dump(cfg, open('config.workflow.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY

      - name: 运行破线监控
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 monitor.py --config config.workflow.json --no-notify

      - name: 生成首页
        run: |
          cp output/dashboard.html output/index.html

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
