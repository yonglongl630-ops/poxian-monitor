name: 同花顺Cookie自动刷新

on:
  schedule:
    # GitHub Actions 使用 UTC 时间；北京时间 = UTC+8
    # 0 2,6 * * 1-5 = 北京时间 10:00 / 14:00（周一至周五）
    - cron: '0 2,6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 自动刷新同花顺Cookie（自检闭环）
        env:
          THS_COOKIE: ${{ secrets.THS_COOKIE }}
          THS_USERNAME: ${{ secrets.THS_USERNAME }}
          THS_PASSWORD: ${{ secrets.THS_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          python3 ths_cookie_refresh.py
