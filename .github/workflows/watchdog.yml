name: 漏跑自检补跑

on:
  schedule:
    # GitHub Actions 使用 UTC 时间；北京时间 = UTC+8
    # 55 2 * * 1-5 = 北京时间 10:55（周一至周五），检查当天上午是否已有监控快照
    - cron: '55 2 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查今日上午快照，缺失则自动补跑
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/history.jsonl" -o output/history.jsonl || true
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, '.')
          import stock_data

          if not stock_data.is_trading_day_today():
              print('今天非交易日，跳过补跑')
              raise SystemExit(0)
          today = stock_data._now().strftime('%Y-%m-%d')
          morning = []
          try:
              with open('output/history.jsonl', encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          e = json.loads(line)
                      except Exception:
                          continue
                      if e.get('date') == today and (e.get('time') or '')[:2] in ('09', '10', '11'):
                          morning.append(e.get('generated_at'))
          except Exception:
              pass
          print('今天上午快照数:', len(morning))
          if morning:
              raise SystemExit(0)
          print('上午快照缺失，触发补跑')
          with open('/tmp/need_run', 'w', encoding='utf-8') as f:
              f.write('1')
          PY
          if [ -f /tmp/need_run ]; then
            curl -sL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches" \
              -d '{"ref":"main","inputs":{"force_push":true}}'
            echo "已触发补跑（force_push）"
          fi
